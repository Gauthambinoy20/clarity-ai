name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; [nltk.download(p, quiet=True) for p in ['punkt','punkt_tab','averaged_perceptron_tagger','stopwords']]"

      - name: Lint (ruff)
        run: ruff check app/ --select E,F,W --ignore E501

      - name: Format check (black)
        run: black --check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: SAST (bandit)
        run: bandit -r app/ -q

      - name: Dependency audit (pip-audit)
        # Two transformers advisories are acknowledged, not ignored lightly:
        # both sit in checkpoint-conversion / Trainer code paths this
        # inference-only app never executes, model weights are pinned to
        # exact hub revisions, and the only fixed release is a 5.0 RC.
        # Dependabot will surface the stable 5.x when it lands.
        run: |
          pip-audit -r requirements.txt --no-deps \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2026-1839

      - name: Tests with coverage gate
        run: pytest tests/ --cov=app --cov-report=term --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, zero warnings)
        run: npx eslint src --max-warnings 0

      - name: Format check (prettier)
        run: npx prettier --check src

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Dependency audit (npm, prod, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
