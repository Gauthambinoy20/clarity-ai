name: Deploy

# Continuous deployment: build both images, push to GHCR, roll the stack
# on the EC2 host and smoke-test the live URL. The deploy job stays inert
# until the repo variable DEPLOY_ENABLED is set to 'true' and the
# DEPLOY_HOST / DEPLOY_SSH_KEY / LIVE_DOMAIN secrets exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/gauthambinoy20/clarity-ai-backend:latest
            ghcr.io/gauthambinoy20/clarity-ai-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/gauthambinoy20/clarity-ai-frontend:latest
            ghcr.io/gauthambinoy20/clarity-ai-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Ship compose file and Caddyfile to the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml deploy/Caddyfile \
            ubuntu@"$DEPLOY_HOST":/opt/clarityai/

      - name: Roll the stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            ubuntu@"$DEPLOY_HOST" \
            "cd /opt/clarityai && \
             docker compose -f docker-compose.prod.yml --env-file .env pull && \
             docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans && \
             docker image prune -f"

      - name: Smoke-test the live URL
        env:
          LIVE_DOMAIN: ${{ secrets.LIVE_DOMAIN }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$LIVE_DOMAIN/api/v1/health" | grep -q healthy; then
              echo "live and healthy"
              exit 0
            fi
            echo "waiting for the stack ($i/12)..."
            sleep 10
          done
          echo "live URL never came healthy" >&2
          exit 1
